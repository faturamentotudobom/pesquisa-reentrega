<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Buscador Dinâmico de Planilha</title>
    <style>
        * { box-sizing: border-box; }
        
        body { 
            font-family: Arial, sans-serif; 
            margin: 0;
            padding: 15px; 
            background-color: #f4f4f9; 
        }
        
        .container { 
            width: 100%;
            max-width: 1100px; 
            margin: 0 auto; 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }
        
        h2 {
            margin-top: 0;
            font-size: 1.4rem;
            color: #333;
        }
        
        .busca-container { 
            display: grid; 
            grid-template-columns: 1fr;
            gap: 10px; 
            margin-bottom: 20px; 
            width: 100%;
        }

        .campo-grupo {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .campo-grupo label {
            font-size: 12px;
            font-weight: bold;
            color: #555;
        }
        
        input, select { 
            width: 100%; 
            padding: 10px 12px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            font-size: 15px;
            min-height: 45px;
            background-color: white;
        }

        .btn-container {
            display: flex;
            align-items: flex-end;
        }
        
        button { 
            width: 100%;
            padding: 12px 24px; 
            background-color: #007bff; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 16px; 
            cursor: pointer; 
            font-weight: bold; 
            min-height: 45px;
            transition: background 0.2s;
        }
        
        button:active { background-color: #004085; }

        /* Painel de Resumo / KPI Dashboard */
        .resumo-container {
            display: none;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .card-resumo {
            background-color: #e9ecef;
            border-left: 4px solid #007bff;
            padding: 12px 15px;
            border-radius: 6px;
        }

        .card-resumo .titulo {
            font-size: 12px;
            color: #6c757d;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .card-resumo .valor {
            font-size: 18px;
            font-weight: bold;
            color: #212529;
        }
        
        .tabela-wrapper { 
            overflow-x: auto; 
            -webkit-overflow-scrolling: touch; 
            margin-top: 10px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        
        table { 
            width: 100%; 
            border-collapse: collapse; 
            display: none; 
        }
        
        th, td { 
            border: 1px solid #ddd; 
            padding: 10px 12px; 
            text-align: left; 
            white-space: nowrap; 
            font-size: 14px;
        }
        
        th { 
            background-color: #007bff; 
            color: white; 
            position: sticky;
            top: 0;
        }
        
        tr:nth-child(even) { background-color: #f9f9f9; }
        
        .status { 
            color: #721c24; 
            background-color: #f8d7da; 
            padding: 10px; 
            border-radius: 6px; 
            display: none; 
            margin-bottom: 15px; 
            font-size: 14px;
        }
        
        .sem-resultados { 
            color: #721c24; 
            background-color: #f8d7da; 
            padding: 12px; 
            border-radius: 6px; 
            font-weight: bold; 
            margin-top: 10px; 
            display: none; 
            font-size: 14px;
        }

        /* Ajustes para telas médias/grandes (Tablets e PCs) */
        @media (min-width: 768px) {
            body { padding: 30px; }
            .container { padding: 25px; }
            h2 { font-size: 1.8rem; }
            
            .busca-container { 
                grid-template-columns: 1.5fr 1.2fr 1fr 1fr auto;
            }
            
            button { width: auto; }
            th, td { font-size: 15px; padding: 12px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Buscar na Planilha - Controle de Ocorrências</h2>
    <div id="mensagemErro" class="status"></div>
    
    <div class="busca-container">
        <!-- Campo RCA -->
        <div class="campo-grupo">
            <label for="buscar">RCA</label>
            <input type="text" id="buscar" placeholder="Código do RCA...">
        </div>
        
        <!-- Seleção de Ocorrência -->
        <div class="campo-grupo">
            <label for="filtroOcorrencia">Ocorrências</label>
            <select id="filtroOcorrencia">
                <option value="REENTREGA">Apenas Reentregas</option>
                <!--<option value="TODAS">Todas as Ocorrências</option>-->
            </select>
        </div>

        <!-- Filtros de Data -->
        <div class="campo-grupo">
            <label for="dataInicio">Data Inicial (DTOCOR)</label>
            <input type="date" id="dataInicio">
        </div>

        <div class="campo-grupo">
            <label for="dataFim">Data Final (DTOCOR)</label>
            <input type="date" id="dataFim">
        </div>
        
        <!-- Botão de Pesquisa -->
        <div class="btn-container">
            <button id="btnPesquisar" onclick="buscarDados()">Pesquisar</button>
        </div>
    </div>

    <!-- Cards de Resumo -->
    <div id="painelResumo" class="resumo-container">
        <div class="card-resumo">
            <div class="titulo">Qtd. Registros</div>
            <div id="resumoQtd" class="valor">0</div>
        </div>
        <div class="card-resumo">
            <div class="titulo">Total Valor</div>
            <div id="resumoValor" class="valor">R$ 0,00</div>
        </div>
        <div class="card-resumo">
            <div class="titulo">Total Peso</div>
            <div id="resumoPeso" class="valor">0 kg</div>
        </div>
    </div>
    
    <div id="semResultados" class="sem-resultados">Aviso: Nenhum registro localizado para os filtros informados.</div>

    <div class="tabela-wrapper">
        <table id="tabelaDados">
            <thead>
                <tr id="cabecalho"></tr>
            </thead>
            <tbody id="corpoTabela"></tbody>
        </table>
    </div>
</div>

<script>
    const urlCSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTH4KEirinMtbQwYVJnJnR6K5VRyi6UTTO3nUtVnsJaHb8y60kNqSJYMt5CjKD4iSA4q_Wt_F3QeXXd/pub?gid=0&single=true&output=csv'; 
    let dadosPlanilha = [];

    function parseCSV(texto, separador) {
        const linhas = texto.split(/\r?\n/);
        return linhas.map(linha => {
            const resultado = [];
            let celula = '';
            let dentroDeAspas = false;

            for (let i = 0; i < linha.length; i++) {
                const char = linha[i];
                const proximoChar = linha[i + 1];

                if (char === '"') {
                    if (dentroDeAspas && proximoChar === '"') {
                        celula += '"';
                        i++;
                    } else {
                        dentroDeAspas = !dentroDeAspas;
                    }
                } else if (char === separador && !dentroDeAspas) {
                    resultado.push(celula.trim());
                    celula = '';
                } else {
                    celula += char;
                }
            }
            resultado.push(celula.trim());
            return resultado;
        });
    }

    async function carregarDados() {
        const divErro = document.getElementById('mensagemErro');
        try {
            const resposta = await fetch(urlCSV);
            if (!resposta.ok) throw new Error("Não foi possível acessar o link da planilha.");

            const texto = await resposta.text();
            const separador = texto.includes(';') ? ';' : ',';
            const linhas = parseCSV(texto, separador);
            
            dadosPlanilha = linhas.filter(linha => linha.some(celula => celula !== ''));

            if (dadosPlanilha.length > 0) {
                divErro.style.display = 'none';
            } else {
                showError("A planilha está vazia.");
            }
        } catch (erro) {
            console.error(erro);
            showError("Erro ao carregar dados: " + erro.message);
        }
    }

    function showError(mensagem) {
        const divErro = document.getElementById('mensagemErro');
        divErro.innerHTML = mensagem;
        divErro.style.display = 'block';
    }

    function converterParaNumero(valor) {
        if (!valor) return 0;
        let valorLimpo = valor.replace(/[R$\s]/g, '');
        if (valorLimpo.includes(',')) {
            valorLimpo = valorLimpo.replace(/\./g, '').replace(',', '.');
        }
        const num = parseFloat(valorLimpo);
        return isNaN(num) ? 0 : num;
    }

    // Função para converter texto de data da planilha para Objeto Date do JavaScript
    function parseDataPlanilha(dataStr) {
        if (!dataStr) return null;
        
        // Remove hora se houver (ex: "25/05/2024 14:30" -> "25/05/2024")
        const parteData = dataStr.split(' ')[0].trim();
        
        // Formato DD/MM/AAAA ou DD/MM/AA
        if (parteData.includes('/')) {
            const partes = parteData.split('/');
            if (partes.length === 3) {
                let dia = parseInt(partes[0], 10);
                let mes = parseInt(partes[1], 10) - 1; // Mês no JS começa em 0
                let ano = parseInt(partes[2], 10);
                if (ano < 100) ano += 2000; // Ajusta anos de 2 dígitos
                return new Date(ano, mes, dia);
            }
        }
        
        // Formato AAAA-MM-DD
        if (parteData.includes('-')) {
            const partes = parteData.split('-');
            if (partes.length === 3) {
                return new Date(parseInt(partes[0], 10), parseInt(partes[1], 10) - 1, parseInt(partes[2], 10));
            }
        }

        return null;
    }

    function atualizarResumo(linhasFiltradas, cabecalho) {
        const painelResumo = document.getElementById('painelResumo');
        
        if (linhasFiltradas.length === 0) {
            painelResumo.style.display = 'none';
            return;
        }

        const idxValor = cabecalho.findIndex(col => col.toUpperCase() === 'VLTOTAL');
        const idxPeso = cabecalho.findIndex(col => col.toUpperCase() === 'TOTPESO');

        let totalValor = 0;
        let totalPeso = 0;

        linhasFiltradas.forEach(linha => {
            if (idxValor !== -1) totalValor += converterParaNumero(linha[idxValor]);
            if (idxPeso !== -1) totalPeso += converterParaNumero(linha[idxPeso]);
        });

        document.getElementById('resumoQtd').innerText = linhasFiltradas.length;
        
        document.getElementById('resumoValor').innerText = totalValor.toLocaleString('pt-BR', {
            style: 'currency',
            currency: 'BRL'
        });

        document.getElementById('resumoPeso').innerText = totalPeso.toLocaleString('pt-BR', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }) + ' kg';

        painelResumo.style.display = 'grid';
    }

    function renderizarTabela(dados, mostrarApenasCabecalho = false) {
        const tabela = document.getElementById('tabelaDados');
        const cabecalho = document.getElementById('cabecalho');
        const corpo = document.getElementById('corpoTabela');
        
        cabecalho.innerHTML = '';
        corpo.innerHTML = '';

        if(dados.length === 0) {
            tabela.style.display = 'none';
            return;
        }

        dados[0].forEach(coluna => {
            cabecalho.innerHTML += `<th>${coluna}</th>`;
        });

        if (mostrarApenasCabecalho) {
            tabela.style.display = 'none';
            return;
        }

        for (let i = 1; i < dados.length; i++) {
            let linhaHtml = '<tr>';
            dados[i].forEach(celula => {
                linhaHtml += `<td>${celula}</td>`;
            });
            linhaHtml += '</tr>';
            corpo.innerHTML += linhaHtml;
        }

        tabela.style.display = 'table';
    }

    function buscarDados() {
        const termo = document.getElementById('buscar').value.toLowerCase().trim();
        const opcaoOcorrencia = document.getElementById('filtroOcorrencia').value;
        const valDataInicio = document.getElementById('dataInicio').value;
        const valDataFim = document.getElementById('dataFim').value;
        const divSemResultados = document.getElementById('semResultados');
        
        if (!termo) {
            renderizarTabela([], true);
            atualizarResumo([], []);
            divSemResultados.style.display = 'none';
            return;
        }

        const cabecalho = dadosPlanilha[0];
        const idxRca = cabecalho.findIndex(col => col.toUpperCase() === 'RCA');
        const idxSituacao = cabecalho.findIndex(col => col.toUpperCase() === 'SITUACAO' || col.toUpperCase() === 'SITUAÇÃO');
        const idxDtOcor = cabecalho.findIndex(col => col.toUpperCase() === 'DTOCOR');

        if (idxRca === -1 || idxSituacao === -1) {
            alert("Erro interno: Não foi possível localizar as colunas 'RCA' ou 'SITUACAO' na planilha.");
            return;
        }

        // Prepara objetos de data para comparação
        const dtInicio = valDataInicio ? new Date(valDataInicio + 'T00:00:00') : null;
        const dtFim = valDataFim ? new Date(valDataFim + 'T23:59:59') : null;

        const linhasFiltradas = dadosPlanilha.slice(1).filter(linha => {
            const valorRca = linha[idxRca] ? linha[idxRca].toLowerCase() : '';
            const valorSituacao = linha[idxSituacao] ? linha[idxSituacao].toUpperCase() : '';

            // 1. Filtro RCA
            const bateRca = (valorRca === termo);
            if (!bateRca) return false;
            
            // 2. Filtro de Ocorrência
            let bateSituacao = false;
            if (opcaoOcorrencia === 'REENTREGA') {
                bateSituacao = (valorSituacao === 'REENTREGA1' || valorSituacao === 'REENTREGA2');
            } else if (opcaoOcorrencia === 'TODAS') {
                bateSituacao = true;
            }
            if (!bateSituacao) return false;

            // 3. Filtro por Período de Data (DTOCOR)
            if (dtInicio || dtFim) {
                if (idxDtOcor === -1) return true; // Se a coluna não existir, ignora a trava de data
                
                const dtLinha = parseDataPlanilha(linha[idxDtOcor]);
                if (!dtLinha) return false; // Se não conseguir ler a data da linha, ignora

                if (dtInicio && dtLinha < dtInicio) return false;
                if (dtFim && dtLinha > dtFim) return false;
            }

            return true;
        });

        if (linhasFiltradas.length > 0) {
            divSemResultados.style.display = 'none';
            renderizarTabela([cabecalho, ...linhasFiltradas]);
            atualizarResumo(linhasFiltradas, cabecalho);
        } else {
            renderizarTabela([], true);
            atualizarResumo([], []);
            divSemResultados.style.display = 'block';
        }
    }

    document.getElementById('buscar').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            buscarDados();
            document.getElementById('buscar').blur();
        }
    });

    carregarDados();
</script>

</body>
</html>
