<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador Dinâmico de Planilha</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .container { max-width: 95%; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .busca-container { display: flex; gap: 10px; margin-bottom: 20px; max-width: 500px; }
        input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        button { padding: 12px 24px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        .tabela-wrapper { overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; display: none; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; white-space: nowrap; }
        th { background-color: #007bff; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .status { color: #721c24; background-color: #f8d7da; padding: 10px; border-radius: 4px; display: none; margin-bottom: 15px; }
        .sem-resultados { color: #721c24; background-color: #f8d7da; padding: 12px; border-radius: 4px; font-weight: bold; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Buscar na Planilha - Controle de Reentregas</h2>
    <div id="mensagemErro" class="status"></div>
    
    <div class="busca-container">
        <input type="text" id="buscar" placeholder="Digite o número exato do RCA...">
        <button id="btnPesquisar" onclick="buscarDados()">Pesquisar</button>
    </div>
    
    <div id="semResultados" class="sem-resultados">Aviso: Nenhum registro de REENTREGA localizado para o RCA informado.</div>

    <div class="tabela-wrapper">
        <table id="tabelaDados">
            <thead>
                <tr id="cabecalho"></tr>
            </thead>
            <tbody id="corpoTabela"></tbody>
        </table>
    </div>
</div>

<script>
    const urlCSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTH4KEirinMtbQwYVJnJnR6K5VRyi6UTTO3nUtVnsJaHb8y60kNqSJYMt5CjKD4iSA4q_Wt_F3QeXXd/pub?gid=0&single=true&output=csv'; 
    let dadosPlanilha = [];

    // Função Robusta para ler CSV respeitando vírgulas dentro de aspas
    function parseCSV(texto, separador) {
        const linhas = texto.split(/\r?\n/);
        return linhas.map(linha => {
            const resultado = [];
            let celula = '';
            let dentroDeAspas = false;

            for (let i = 0; i < linha.length; i++) {
                const char = linha[i];
                const proximoChar = linha[i + 1];

                if (char === '"') {
                    if (dentroDeAspas && proximoChar === '"') {
                        celula += '"'; // Aspas duplas escapadas dentro do texto
                        i++;
                    } else {
                        dentroDeAspas = !dentroDeAspas; // Alterna estado de aspas
                    }
                } else if (char === separador && !dentroDeAspas) {
                    resultado.push(celula.trim());
                    celula = '';
                } else {
                    celula += char;
                }
            }
            resultado.push(celula.trim());
            return resultado;
        });
    }

    async function carregarDados() {
        const divErro = document.getElementById('mensagemErro');
        try {
            const resposta = await fetch(urlCSV);
            if (!resposta.ok) throw new Error("Não foi possível acessar o link da planilha.");

            const texto = await resposta.text();
            
            // Detecta se o separador padrão é ponto e vírgula ou vírgula
            const separador = texto.includes(';') ? ';' : ',';
            
            // Usa o novo Parser inteligente em vez do .split simples
            const linhas = parseCSV(texto, separador);
            
            // Limpa linhas em branco
            dadosPlanilha = linhas.filter(linha => linha.some(celula => celula !== ''));

            if (dadosPlanilha.length > 0) {
                divErro.style.display = 'none';
            } else {
                showError("A planilha está vazia.");
            }
        } catch (erro) {
            console.error(erro);
            showError("Erro ao carregar dados: " + erro.message);
        }
    }

    function showError(mensagem) {
        const divErro = document.getElementById('mensagemErro');
        divErro.innerHTML = mensagem;
        divErro.style.display = 'block';
    }

    function renderizarTabela(dados, mostrarApenasCabecalho = false) {
        const tabela = document.getElementById('tabelaDados');
        const cabecalho = document.getElementById('cabecalho');
        const corpo = document.getElementById('corpoTabela');
        
        cabecalho.innerHTML = '';
        corpo.innerHTML = '';

        if(dados.length === 0) {
            tabela.style.display = 'none';
            return;
        }

        dados[0].forEach(coluna => {
            cabecalho.innerHTML += `<th>${coluna}</th>`;
        });

        if (mostrarApenasCabecalho) {
            tabela.style.display = 'none';
            return;
        }

        for (let i = 1; i < dados.length; i++) {
            let linhaHtml = '<tr>';
            dados[i].forEach(celula => {
                linhaHtml += `<td>${celula}</td>`;
            });
            linhaHtml += '</tr>';
            corpo.innerHTML += linhaHtml;
        }

        tabela.style.display = 'table';
    }

    function buscarDados() {
        const termo = document.getElementById('buscar').value.toLowerCase().trim();
        const divSemResultados = document.getElementById('semResultados');
        
        if (!termo) {
            renderizarTabela([], true);
            divSemResultados.style.display = 'none';
            return;
        }

        const cabecalho = dadosPlanilha[0];
        const idxRca = cabecalho.findIndex(col => col.toUpperCase() === 'RCA');
        const idxSituacao = cabecalho.findIndex(col => col.toUpperCase() === 'SITUACAO' || col.toUpperCase() === 'SITUAÇÃO');

        if (idxRca === -1 || idxSituacao === -1) {
            alert("Erro interno: Não foi possível localizar as colunas 'RCA' ou 'SITUACAO' na planilha.");
            return;
        }

        const linhasFiltradas = dadosPlanilha.slice(1).filter(linha => {
            const valorRca = linha[idxRca] ? linha[idxRca].toLowerCase() : '';
            const valorSituacao = linha[idxSituacao] ? linha[idxSituacao].toUpperCase() : '';

            const bateRca = (valorRca === termo);
            const bateSituacao = (valorSituacao === 'REENTREGA1' || valorSituacao === 'REENTREGA2');

            return bateRca && bateSituacao;
        });

        if (linhasFiltradas.length > 0) {
            divSemResultados.style.display = 'none';
            renderizarTabela([cabecalho, ...linhasFiltradas]);
        } else {
            renderizarTabela([], true);
            divSemResultados.style.display = 'block';
        }
    }

    document.getElementById('buscar').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            buscarDados();
        }
    });

    carregarDados();
</script>

</body>
</html>
